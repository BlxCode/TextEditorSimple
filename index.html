<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans&family=Lato&family=Merriweather&family=Montserrat&family=Nunito&family=Oswald&family=Playfair+Display&family=Poppins&family=Roboto+Slab&family=Source+Code+Pro&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: gainsboro;
      }
      #text-area {
        background: whitesmoke;
        border-radius: 2px;
        padding: 10px;
        font-size: 16px;
        width: 80%;
        height: fit-content;
        min-height: 70vh;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      }
      select {
        padding: 5px;
        font-size: 14px;
        border-radius: 10px;
        cursor: pointer;
        background-color: whitesmoke;
        width: auto;
        max-width: 150px;
        border-style: solid;
      }
      input {
        padding: 5px;
        font-size: 14px;
        border-radius: 10px;
        cursor: text;
        background-color: whitesmoke;
        width: 100px;
        border-style: solid;
        border-width: 1px;
      }
      button {
        padding: 5px;
        font-size: 14px;
        border-radius: 10px;
        cursor: pointer;
        background-color: whitesmoke;
        width: 100px;
        border-style: solid;
        border-width: 1px;
        border-color: #767676;
      }
      button:hover {
        transform: scale(1.02);
      }
      button:active {
        transform: scale(0.98);
      }
      .custom-file-upload:hover {
        transform: scale(1.02);
      }
      .custom-file-upload:active {
        transform: scale(0.98);
      }
      #import {
        cursor: pointer;
      }
      input[type="file"] {
        display: none;
      }

      .custom-file-upload {
        padding: 5px;
        font-size: 14px;
        border-radius: 10px;
        cursor: pointer;
        background-color: whitesmoke;
        width: 100px;
        border-style: solid;
        border-width: 1px;
        border-color: #767676;
      }
      .custom-file-upload:hover {
        transform: scale(1.02);
      }
      .custom-file-upload:active {
        transform: scale(0.98);
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TextEditorSimple.vercel.app</title>
  </head>
  <body>
    <center style="user-select: none !important">
      <h1>TextEditorSimple.vercel.app</h1>
      <span>Simple Text Editor with Local Storage</span>
      <br />

      <label for="inport">
        <button class="custom-file-upload">Import</button></label
      >
      <input id="inport" type="file" />
      <button id="save" onclick="saveText()">Export</button>
      <select id="themeSelector">
        <option value="auto">Auto</option>
        <option value="light">Light Theme</option>
        <option value="dark">Dark Theme</option>
      </select>

      <select id="fontSelector">
        <option value="Arial" selected>Arial</option>
        <option value="Fira Sans">Fira Sans</option>
        <option value="Lato">Lato</option>
        <option value="Merriweather">Merriweather</option>
        <option value="Montserrat">Montserrat</option>
        <option value="Nunito">Nunito</option>
        <option value="Oswald">Oswald</option>
        <option value="Playfair Display">Playfair Display</option>
        <option value="Poppins">Poppins</option>
        <option value="Roboto">Roboto</option>
        <option value="Roboto Slab">Roboto Slab</option>
        <option value="Source Code Pro">Source Code Pro</option>
      </select>

      <input
        type="number"
        id="fontSizeInput"
        placeholder="Font Size (px)"
        value="16"
        min="8"
        max="72"
      />

      <br />
      <br />
    </center>
    <div id="text-area" contenteditable="true"></div>

    <script src="script.js"></script>
  </body>
</html>
