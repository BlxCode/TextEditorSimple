<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans&family=Lato&family=Merriweather&family=Montserrat&family=Nunito&family=Oswald&family=Playfair+Display&family=Poppins&family=Roboto+Slab&family=Source+Code+Pro&display=swap" rel="stylesheet">
    <style>
        body{
            background:gainsboro;

        }
        textarea{
            background:whitesmoke;
            border-radius: 10px;
            padding: 10px;
            font-size: 16px;
        }
        select{
            padding: 5px;
            font-size: 14px;
            border-radius:10px;
            cursor:pointer;
            background-color:whitesmoke;
        }
      
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextEditorSimple.vercel.app</title>
</head>
<body>
    <center>
    <h1>TextEditorSimple.vercel.app</h1>
    <span>Simple Text Editor with Local Storage</span>
    <br>
    <select id="themeSelector">
        <option value="light">Light Theme</option>
        <option value="dark">Dark Theme</option>
    </select>
    <select id="fontSelector">
    <option value="Arial" selected>Arial</option>
    <option value="Fira Sans">Fira Sans</option>
    <option value="Lato">Lato</option>
    <option value="Merriweather">Merriweather</option>
    <option value="Montserrat">Montserrat</option>
    <option value="Nunito">Nunito</option>
    <option value="Oswald">Oswald</option>
    <option value="Playfair Display">Playfair Display</option>
    <option value="Poppins">Poppins</option>
    <option value="Roboto">Roboto</option>
    <option value="Roboto Slab">Roboto Slab</option>
    <option value="Source Code Pro">Source Code Pro</option>
</select>

    <br>
    <br>
    <textarea cols="60" rows="10">
Lorem Ipsum
    </textarea>
    </center>
    <script>
const textarea = document.querySelector('textarea');
if (localStorage.getItem('textareaValue')) {
   textarea.value = localStorage.getItem('textareaValue');
}

textarea.addEventListener('input', () => {
   localStorage.setItem('textareaValue', textarea.value);
});
const fontSelector = document.getElementById('fontSelector');
const themeSelector = document.getElementById('themeSelector');
if (localStorage.getItem('selectedFont')) {
    const selectedFont = localStorage.getItem('selectedFont');
    textarea.style.fontFamily = selectedFont;
    fontSelector.value = selectedFont;
} else {
    textarea.style.fontFamily = 'Arial';
}
if (localStorage.getItem('theme') === 'dark') {
    document.body.style.backgroundColor = 'rgb(58, 58, 61)';
    document.body.style.color = 'white';
    textarea.style.backgroundColor = 'rgb(69, 68, 72)';
    textarea.style.color = 'white';
    themeSelector.style.backgroundColor = 'rgb(69, 68, 72)';
    themeSelector.style.color = 'white';
    fontSelector.style.backgroundColor = 'rgb(69, 68, 72)';
    fontSelector.style.color = 'white';
    themeSelector.value = 'dark';
} else {
    document.body.style.backgroundColor = 'gainsboro';
    document.body.style.color = 'black';
    textarea.style.backgroundColor = 'whitesmoke';
    textarea.style.color = 'black';
    themeSelector.style.backgroundColor = 'whitesmoke';
    themeSelector.style.color = 'black';
    fontSelector.style.backgroundColor = 'whitesmoke';
    fontSelector.style.color = 'black';
}  



themeSelector.addEventListener('change', () => {
    if (themeSelector.value === 'dark') {
        localStorage.setItem('theme', 'dark');
        document.body.style.backgroundColor = 'rgb(58, 58, 61)';
        document.body.style.color = 'white';
        textarea.style.backgroundColor = 'rgb(69, 68, 72)';
        textarea.style.color = 'white';
        themeSelector.style.backgroundColor = 'rgb(69, 68, 72)';
        themeSelector.style.color = 'white';
        fontSelector.style.backgroundColor = 'rgb(69, 68, 72)';
        fontSelector.style.color = 'white';
    } else {
        localStorage.setItem('theme', 'light');
        document.body.style.backgroundColor = 'gainsboro';
        document.body.style.color = 'black';
        textarea.style.backgroundColor = 'whitesmoke';
        textarea.style.color = 'black';
        themeSelector.style.backgroundColor = 'whitesmoke';
        themeSelector.style.color = 'black';
        fontSelector.style.backgroundColor = 'whitesmoke';
        fontSelector.style.color = 'black';
    }
});



fontSelector.addEventListener('change', () => {
    const selectedFont = fontSelector.value;
    textarea.style.fontFamily = selectedFont;
    localStorage.setItem('selectedFont', selectedFont);
});
    </script>
</body>
</html>
